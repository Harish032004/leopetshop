<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo's Pet Barkery | Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login">
    <header class="site-header" id="site-header"></header>
    <main class="page-shell">
        <div class="container">
            <section class="auth-layout">
                <article class="auth-panel hero-auth">
                    <span class="eyebrow">Welcome back</span>
                    <h1>Sign in to continue shopping for your pets</h1>
                    <p>Track orders, manage addresses, and checkout faster anytime.</p>
                    <div class="auth-points">
                        <div>Fast reorder experience</div>
                        <div>Easy order tracking</div>
                        <div>Saved cart access</div>
                    </div>
                </article>
                <article class="auth-panel" id="login-form-root"></article>
            </section>
        </div>
    </main>
    <footer class="footer" id="site-footer"></footer>
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/main.js" defer></script>
</body>
</html>
