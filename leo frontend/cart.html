<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo's Pet Barkery | Cart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="cart">
    <header class="site-header" id="site-header"></header>
    <main class="page-shell">
        <div class="container">
            <section class="page-hero">
                <span class="eyebrow">Your cart</span>
                <h1>Everything ready for checkout</h1>
                <p>Review your chosen pet essentials, update quantities, and move ahead to a smooth checkout.</p>
            </section>
            <section class="checkout-grid">
                <div class="cart-card" id="cart-items-root"></div>
                <aside class="summary-card" id="cart-summary-root"></aside>
            </section>
        </div>
    </main>
    <footer class="footer" id="site-footer"></footer>
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/cart.js" defer></script>
</body>
</html>
