<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo's Pet Barkery | Reset Password</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="reset-password">
    <header class="site-header" id="site-header"></header>
    <main class="page-shell">
        <div class="container">
            <section class="auth-layout">
                <article class="auth-panel hero-auth">
                    <span class="eyebrow">Secure recovery</span>
                    <h1>Reset your password and get back to your pet shopping</h1>
                    <p>Use the secure reset link from your email to create a fresh password for your account.</p>
                    <div class="auth-points">
                        <div>Secure one-time reset link</div>
                        <div>Updates your password in MySQL</div>
                        <div>Login again with your new password</div>
                    </div>
                </article>
                <article class="auth-panel" id="reset-password-form-root"></article>
            </section>
        </div>
    </main>
    <footer class="footer" id="site-footer"></footer>
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/main.js" defer></script>
</body>
</html>
