<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo's Pet Barkery | Register</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="register">
    <header class="site-header" id="site-header"></header>
    <main class="page-shell">
        <div class="container">
            <section class="auth-layout">
                <article class="auth-panel hero-auth">
                    <span class="eyebrow">Create account</span>
                    <h1>Join Leo's family of pet-loving shoppers</h1>
                    <p>Build your account to enjoy saved addresses, order history, and quick checkout.</p>
                    <div class="auth-points">
                        <div>Special customer-only offers</div>
                        <div>Order history and tracking</div>
                        <div>Easy reorders</div>
                    </div>
                </article>
                <article class="auth-panel" id="register-form-root"></article>
            </section>
        </div>
    </main>
    <footer class="footer" id="site-footer"></footer>
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/main.js" defer></script>
</body>
</html>
