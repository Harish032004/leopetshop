<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo's Pet Barkery | My Orders</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="my-orders">
    <header class="site-header" id="site-header"></header>
    <main class="page-shell">
        <div class="container">
            <section class="page-hero">
                <span class="eyebrow">Order history</span>
                <h1>Track every order you've placed for your pets</h1>
                <p>View status updates, totals, and quick links to reorder your pet's favorite essentials.</p>
            </section>
            <section class="orders-grid" id="orders-root"></section>
        </div>
    </main>
    <footer class="footer" id="site-footer"></footer>
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/orders.js" defer></script>
</body>
</html>
