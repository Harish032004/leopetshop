<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo's Pet Barkery | Track Order</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="track-order">
    <header class="site-header" id="site-header"></header>
    <main class="page-shell">
        <div class="container">
            <section class="page-hero">
                <span class="eyebrow">Track order</span>
                <h1>Follow your order from checkout to doorstep</h1>
                <p>Enter your order number or browse recent orders to stay updated on every delivery step.</p>
            </section>
            <section class="track-workspace">
                <article id="track-form-root"></article>
                <article id="track-result-root"></article>
            </section>
        </div>
    </main>
    <footer class="footer" id="site-footer"></footer>
    <script src="js/api.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/orders.js" defer></script>
</body>
</html>
