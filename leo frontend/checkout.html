<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo's Pet Barkery | Checkout</title>
    <link rel="icon" type="image/png" href="assets/logo/leologo1.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="checkout">
    <header class="site-header" id="site-header"></header>
    <main class="page-shell">
        <div class="container">
            <section class="page-hero">
                <span class="eyebrow">Secure checkout</span>
                <h1>One more step to your pet's happy delivery</h1>
                <p>Choose your address, review the order, and keep payment simple with options ready for every customer.</p>
            </section>
            <section class="checkout-grid">
                <div class="detail-panel" id="checkout-form-root"></div>
                <aside class="summary-card" id="checkout-summary-root"></aside>
            </section>
        </div>
    </main>
    <footer class="footer" id="site-footer"></footer>
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="js/checkout.js" defer></script>
</body>
</html>
